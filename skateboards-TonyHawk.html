<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tony Hawk Skateboards - SK8 or Die Workshop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="skateboards-TonyHawk">
  <header>
    <h1>Tony Hawk Collection</h1>
    <p class="subtitle">Tony Hawk skateboard decks</p>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="skateboards.html">Back to Skateboards</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="item-gallery">
      <!-- Images -->
      <div class="item">
        <img src="SK8 pics/Skateboards/Double images/Hawk2.jpg" 
             data-full="SK8 pics/Skateboards/Double images/Hawk2.jpg" 
             data-description="Powell Peralta, Tony Hawk, 1991.">
        <p>Hawk 1991</p>
      </div>

      <div class="item">
        <img src="SK8 pics/Skateboards/Double images/Hawk3.jpg" 
             data-full="SK8 pics/Skateboards/Double images/Hawk3.jpg" 
             data-description="Original Birdhouse Tony Hawk Falcon 1, 2000.">
        <p>Tony Hawk Falcon 1</p>
      </div>

      <div class="item">
        <img src="SK8 pics/Skateboards/Double images/Street Hawk.jpg" 
             data-full="SK8 pics/Skateboards/Double images/Street Hawk.jpg" 
             data-description="Powell Peralta Tony Hawk, Street Hawk, Powell Tail Bone, Powell Rib Bones, Reminence of Powell Jaw Bone 1989.">
        <p>Street Hawk</p>
      </div>

      <!-- You can add additional wheel items here in a similar manner -->
    </section>
  </main>

  <!-- Lightbox Modal (should be included on pages where you want the full image pop-up) -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
      <img class="lightbox-content" id="lightbox-img">
      <div id="caption"></div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
